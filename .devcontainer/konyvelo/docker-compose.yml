# GitHub Codespaces a konyvelo/ projekthez: alkalmazás-konténer (Node 22) és PostgreSQL 16.
services:
  app:
    image: mcr.microsoft.com/devcontainers/javascript-node:1-22-bookworm
    volumes:
      - ../../..:/workspaces:cached
    command: sleep infinity
    # Az adatbázis-konténer hálózatán fut: így a Codespace porttovábbítása (forwardPorts)
    # eléri a programot, az adatbázis pedig a localhost:5432-n érhető el.
    network_mode: service:db
    depends_on:
      - db

  db:
    image: postgres:16
    restart: unless-stopped
    # Az app ennek a konténernek a hálózatán fut, ezért a webes port itt kerül kiadásra:
    # a Codespace porttovábbítása a gazdagépről (a konténeren kívülről) csatlakozik.
    ports:
      - "5173:5173"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - konyvelo-pg-data:/var/lib/postgresql/data

volumes:
  konyvelo-pg-data:
